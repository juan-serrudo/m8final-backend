apiVersion: v1
kind: Service
metadata:
  name: password-manager-api-loadbalancer
  namespace: default
  labels:
    app: password-manager-api
  # Anotación para MetalLB (opcional, descomentar si es necesario)
  # annotations:
  #   metallb.universe.tf/address-pool: default
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: password-manager-api

