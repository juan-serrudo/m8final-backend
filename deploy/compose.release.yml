version: '3.8'

# ===========================================
# Compose de Despliegue en Producción
# ===========================================
# Este archivo despliega la aplicación usando imágenes
# pre-construidas y publicadas en Docker Hub
#
# Variables de entorno requeridas:
# - VERSION: versión a desplegar (v1, v2, etc.)
# - DOCKERHUB_USER: usuario de Docker Hub
#
# Uso:
#   export VERSION=v1
#   export DOCKERHUB_USER=tu_usuario
#   docker-compose -f deploy/compose.release.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: m8final-postgres-release
    environment:
      POSTGRES_DB: password_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_release_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d password_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: m8final-redis-release
    ports:
      - "6379:6379"
    volumes:
      - redis_release_data:/data
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer Database Management
  adminer:
    image: adminer:4.8.1
    container_name: m8final-adminer-release
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Backend Application (NestJS) - Imagen desde Docker Hub
  app:
    image: ${DOCKERHUB_USER}/m8final-backend:${VERSION}
    container_name: m8final-backend-release
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENV_ENTORNO=production
      - ENV_CORS=*
      - ENV_SWAGGER_SHOW=true
      - ENV_SYNCHRONIZE=false
      - APP_MAX_SIZE=10mb
      # Database configuration
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - DB_NAME=password_manager
      # Redis configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Throttler configuration
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=10
      # Version information
      - APP_VERSION=${VERSION}
      - BUILD_DATE=${BUILD_DATE:-$(date -u +"%Y-%m-%dT%H:%M:%SZ")}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Application (React + Vite) - Imagen desde Docker Hub
  frontend:
    image: ${DOCKERHUB_USER}/m8final-frontend:${VERSION}
    container_name: m8final-frontend-release
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: m8final-nginx-release
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - frontend
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_release_data:
    driver: local
  redis_release_data:
    driver: local
